<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحلقات التنشيطية</title>

<style>
body{
font-family:Tahoma,Arial;
background:#f4f6fb;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
max-width:900px;
margin:auto;
}

h1{
color:#1e3a8a;
text-align:center;
margin-bottom:30px;
}

.section-title{
color:#0f766e;
font-weight:bold;
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#1e3a8a;
color:white;
}

button{
padding:10px 20px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:20px;
}

.print{
background:#059669;
color:white;
}

.word{
background:#4f46e5;
color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>منصة الحلقات التنشيطية</h1>

<p><strong>عنوان الحلقة:</strong> التعلم النشط</p>
<p><strong>اليوم:</strong> الثلاثاء</p>
<p><strong>التاريخ:</strong> 1446/10/20</p>

<div class="section-title">المعلمات الحاضرات</div>

<table>
<tr>
<th>م</th>
<th>اسم المعلمة</th>
<th>التوقيع</th>
</tr>

<tr>
<td>1</td>
<td>أسماء محمد</td>
<td></td>
</tr>

<tr>
<td>2</td>
<td>نورة علي</td>
<td></td>
</tr>

<tr>
<td>3</td>
<td>سارة خالد</td>
<td></td>
</tr>

</table>

<br>

<p><strong>المنفذة:</strong> سعاد الغامدي</p>
<p><strong>مديرة المدرسة:</strong> آمال باربود</p>

<button class="print" onclick="window.print()">🖨️ طباعة</button>
<button class="word" onclick="exportWord()">📄 تصدير Word</button>

</div>

<script>
function exportWord(){
var content = document.querySelector(".container").innerHTML;
var blob = new Blob(['\ufeff', content], {type: 'application/msword'});
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = "حلقة_تنشيطية.doc";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}
</script>

</body>
</html>
